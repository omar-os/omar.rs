<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0a0a0a"/>
  <!-- Agent swarm network -->
  <g stroke="#c89b3c" stroke-width="0.8" opacity="0.5">
    <line x1="16" y1="16" x2="8" y2="9"/>
    <line x1="16" y1="16" x2="24" y2="9"/>
    <line x1="16" y1="16" x2="7" y2="20"/>
    <line x1="16" y1="16" x2="25" y2="20"/>
    <line x1="16" y1="16" x2="11" y2="26"/>
    <line x1="16" y1="16" x2="21" y2="26"/>
  </g>
  <!-- Center node (leader) -->
  <circle cx="16" cy="16" r="3.5" fill="#dc143c"/>
  <!-- Outer agent nodes -->
  <circle cx="8" cy="9" r="2" fill="#c89b3c"/>
  <circle cx="24" cy="9" r="2" fill="#c89b3c"/>
  <circle cx="7" cy="20" r="2" fill="#c89b3c"/>
  <circle cx="25" cy="20" r="2" fill="#c89b3c"/>
  <circle cx="11" cy="26" r="2" fill="#c89b3c"/>
  <circle cx="21" cy="26" r="2" fill="#c89b3c"/>
</svg>
