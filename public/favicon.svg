<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0a0a0a"/>
  <!-- Spartan helmet silhouette -->
  <g transform="translate(16,16)" fill="#c89b3c">
    <!-- Helmet dome -->
    <path d="M-8,2 Q-8,-8 0,-10 Q8,-8 8,2 L7,2 Q7,-6 0,-8 Q-7,-6 -7,2 Z"/>
    <!-- Crest/plume -->
    <path d="M-1.5,-10 Q-1,-14 0,-14 Q1,-14 1.5,-10 Q1,-11 0,-11.5 Q-1,-11 -1.5,-10 Z"/>
    <!-- Face guard / T-shape opening -->
    <path d="M-6,2 L-6,6 L-3,6 L-3,3 L-1,3 L-1,10 L1,10 L1,3 L3,3 L3,6 L6,6 L6,2 Z" fill="#0a0a0a"/>
    <!-- Cheek guards -->
    <path d="M-8,2 L-8,8 Q-7,10 -5,8 L-5,6 L-6,6 L-6,2 Z"/>
    <path d="M8,2 L8,8 Q7,10 5,8 L5,6 L6,6 L6,2 Z"/>
  </g>
</svg>
