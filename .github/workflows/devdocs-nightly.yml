name: Developer Docs (Nightly)

# Keeps src/content/devdocs/ in step with the OMAR code. Each night Codex reads
# the omar PRs merged since main's docs were last synced and updates only what
# they made wrong or missing; a new release gets a frozen copy of the docs made
# accurate for its tag. Changes arrive as one rolling pull request
# (devdocs/nightly) for a person to merge.
#
# Runs on the self-hosted runner labelled omar-devdocs, with the Codex CLI
# already installed and signed in there (`codex login`), so it needs no API key
# secret. Also needs "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General).

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Also freeze docs for this release tag (e.g. v0.4.3)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: devdocs-nightly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: omar-devdocs
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OMAR: ${{ github.workspace }}/omar
      BRANCH: devdocs/nightly
    steps:
      - name: Checkout omar.rs
        uses: actions/checkout@v4

      - name: Checkout omar (main, full history and tags)
        uses: actions/checkout@v4
        with:
          repository: omar-os/omar
          path: omar
          fetch-depth: 0

      - name: Keep the omar checkout out of this repository's status
        # The runner keeps its workspace between nights: add the line once.
        run: grep -qx "/omar/" .git/info/exclude || echo "/omar/" >> .git/info/exclude

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies
        run: npm ci

      - name: Check the runner's Codex sign-in
        # The runner's own Codex, signed in by whoever runs the machine. Fails
        # here, before any work, if it is missing or signed out.
        run: |
          codex --version
          codex login status

      - name: Bring main's docs up to date
        id: main
        run: |
          from=$(node -p "try { require('./src/content/devdocs/main/_meta.json').commit } catch { '' }")
          echo "from=$from" >> "$GITHUB_OUTPUT"
          node scripts/devdocs.mjs sync --omar "$OMAR" | tee "$RUNNER_TEMP/sync.log"
          summary=$(sed -n 's/^devdocs: summary in //p' "$RUNNER_TEMP/sync.log")
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Freeze docs for new releases
        id: releases
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          tags=$(node scripts/devdocs.mjs pending --omar "$OMAR")
          if [ -n "$RELEASE" ] && [ ! -d "src/content/devdocs/$RELEASE" ]; then
            tags=$(printf '%s\n%s\n' "$tags" "$RELEASE" | sed '/^$/d' | sort -u)
          fi
          : > "$RUNNER_TEMP/releases.md"
          for tag in $tags; do
            node scripts/devdocs.mjs freeze "$tag" --omar "$OMAR" | tee "$RUNNER_TEMP/freeze.log"
            summary=$(sed -n 's/^devdocs: summary in //p' "$RUNNER_TEMP/freeze.log")
            { echo "### Frozen $tag"; echo; cat "$summary"; echo; echo; } >> "$RUNNER_TEMP/releases.md"
          done

      - name: Build the site
        run: npm run build

      - name: Open or update the pull request
        env:
          SUMMARY: ${{ steps.main.outputs.summary }}
          FROM: ${{ steps.main.outputs.from }}
        run: |
          if git diff --quiet HEAD -- src/content/devdocs &&
             [ -z "$(git ls-files --others --exclude-standard src/content/devdocs)" ]; then
            echo "Docs already match the code; nothing to propose."
            exit 0
          fi
          main=$(node -p "require('./src/content/devdocs/main/_meta.json').commit")
          {
            echo "Nightly developer docs sync, checked against omar-os/omar@${main}."
            echo
            if [ -n "$SUMMARY" ]; then
              echo "### main"; echo; cat "$SUMMARY"; echo; echo
              if [ -n "$FROM" ] && [ "$FROM" != "$main" ]; then
                echo "omar PRs merged since the last sync:"; echo
                # Squash subjects end in (#N); point those at omar, not this repo.
                git -C "$OMAR" log --format='- %s' "$FROM..$main" |
                  sed -E 's/\(#([0-9]+)\)$/(omar-os\/omar#\1)/'
                echo
              fi
            fi
            cat "$RUNNER_TEMP/releases.md"
            echo
            echo "Generated by \`.github/workflows/devdocs-nightly.yml\` with Codex; review before merging."
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/content/devdocs
          git commit -q -m "Sync developer docs with omar-os/omar@${main:0:7}"
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Sync developer docs with the latest OMAR code" --body-file "$RUNNER_TEMP/body.md"
          fi
