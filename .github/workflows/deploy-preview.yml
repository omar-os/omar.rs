name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx astro build --base /omarmy-preview/ --site https://lsk567.github.io

      - name: Deploy to omarmy-preview repo
        env:
          DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
        run: |
          # Trim any whitespace/newlines from token
          CLEAN_TOKEN=$(echo -n "$DEPLOY_TOKEN" | tr -d '[:space:]')
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy preview site"
          git push --force "https://x-access-token:${CLEAN_TOKEN}@github.com/lsk567/omarmy-preview.git" HEAD:gh-pages
